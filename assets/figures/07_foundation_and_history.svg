  <text x="683" y="289" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经历、学习、记忆</text>
  <text x="683" y="314.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">其中形成的联系被保留下来</text>
  <text x="935" y="407" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">过去经历</text>
  <text x="935" y="429.95" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">继续参与</text>
  <rect x="660" y="480" width="490" height="175" rx="7" fill="#FFF6F0" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="660" y="480" width="5" height="175" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="683" y="500" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">当前实在界 B</text>
  <text x="683" y="539" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">当下具体的生理状态与反应</text>
  <text x="683" y="564.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">也受到过去记忆与想象影响</text>
  <text x="600" y="694" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#17212B" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">接近 ≠ 等同</text>
  <text x="600" y="734" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">回到低处，经历仍有影响</text>
  <rect x="50" y="795" width="1100" height="125" rx="7" fill="#F8FAFC" stroke="#334155" stroke-width="1.7" />
  <text x="600" y="817" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#17212B" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">Foundation</text>
  <text x="600" y="860" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#5B6775" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">共同的先天基础：进食、趋利避害</text>
  <polyline points="50,951 1150,951" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="50" y="969" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">A / B 仅区分不同经历路径，不表示发展阶段。向上箭头表示先天机制的作用；当前状态不是空白起点。</text>
</svg>
