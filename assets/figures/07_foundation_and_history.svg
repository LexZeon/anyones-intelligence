  <text x="50" y="62" font-family="Microsoft YaHei" font-size="31" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Foundation 与带着经历的当前状态</text>
  <text x="50" y="111" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">本文定义｜共同的先天基础，不等于经历之后的当下实在界。</text>
