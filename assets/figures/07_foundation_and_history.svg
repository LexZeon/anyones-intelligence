<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
  <title>Foundation 与带着经历的当前状态</title>
  <rect width="100%" height="100%" fill="#ffffff" />
