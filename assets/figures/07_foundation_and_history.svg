  <text x="73" y="539" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">当下具体的生理状态与反应</text>
  <text x="73" y="564.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">也受到过去记忆与想象影响</text>
