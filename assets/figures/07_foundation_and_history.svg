  <text x="73" y="289" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经历、学习、记忆</text>
  <text x="73" y="314.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">其中形成的联系被保留下来</text>
