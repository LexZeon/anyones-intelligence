  <text x="887" y="711.3" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">→ attention output</text>
  <rect x="50" y="856" width="1100" height="144" rx="7" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />
  <text x="76" y="880" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">The analogy concerns connections, weights, and multiple contributions</text>
  <text x="76" y="925" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">This account does not specify component correspondences: memory is not identified with V,</text>
  <text x="76" y="950.65" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">tokens with Q / K, or physiological states with attention weights.</text>
