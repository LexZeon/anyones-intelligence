  <text x="50" y="1052" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Left: the author's hypothesis and analogy. Right: the attention definition in Vaswani et al., §3.2.</text>
