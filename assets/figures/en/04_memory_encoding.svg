<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060">
  <title>Memory encoding: experience, state, and memory properties</title>
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="50" y="28" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">FIGURE 04</text>
  <text x="50" y="62" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Memory encoding: experience, state, and memory properties</text>
  <text x="50" y="111" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Author's hypothesis | Using mockery about body weight to illustrate base weight and affective tone.</text>
