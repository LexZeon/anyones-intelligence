  <text x="50" y="62" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Foundation and present states shaped by experience</text>
  <text x="50" y="111" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Author-defined terms | A shared innate basis is distinct from the current Real shaped by experience.</text>
