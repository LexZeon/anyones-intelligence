  <text x="683" y="500" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Current Real — B</text>
  <text x="683" y="539" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Concrete bodily states and responses,</text>
  <text x="683" y="564.65" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">also influenced by memory</text>
  <text x="683" y="590.3" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">and imagination</text>
  <text x="600" y="694" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">Close does not mean identical</text>
  <text x="600" y="734" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">Returning lower does not erase history</text>
  <rect x="50" y="795" width="1100" height="125" rx="7" fill="#F8FAFC" stroke="#334155" stroke-width="1.7" />
  <text x="600" y="817" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#17212B" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">Foundation</text>
  <text x="600" y="860" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#5B6775" text-anchor="middle" dominant-baseline="text-before-edge" xml:space="preserve">Shared innate mechanisms: feeding and approach–avoidance</text>
  <polyline points="50,951 1150,951" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="50" y="969" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">A / B distinguish histories, not developmental stages. Upward arrows show the influence of innate mechanisms.</text>
  <text x="50" y="990.6" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">The present state is not a blank starting point.</text>
