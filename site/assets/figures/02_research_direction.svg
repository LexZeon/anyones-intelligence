  <text x="56" y="106" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">以作者提出的关系结构为参考，通过量化与原型探索模拟认知。</text>
