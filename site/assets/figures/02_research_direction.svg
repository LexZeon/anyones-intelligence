  <text x="450" y="621" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">艺术</text>
  <text x="450" y="645.3" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">文化</text>
  <text x="450" y="669.6" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">政治</text>
  <rect x="800" y="516" width="344" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="822" y="535" width="34" height="4" rx="0" fill="#D55E00" stroke="none" stroke-width="1" />
  <text x="822" y="553" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">自主思考与意识探索</text>
  <text x="822" y="621" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">自主思考与创新解题</text>
  <text x="822" y="645.3" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">探索模型产生“意识”的可能</text>
