  <text x="56" y="747" font-family="Microsoft YaHei" font-size="14" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">研究方向示意 · 模型架构保持开放 · 长期愿景需要后续研究与验证。</text>
