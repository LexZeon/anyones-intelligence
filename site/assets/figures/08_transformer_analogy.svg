<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110">
  <title>记忆网络与 Transformer：类比，不是组件等价</title>
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="50" y="28" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">FIGURE 08</text>
  <text x="50" y="62" font-family="Microsoft YaHei" font-size="31" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">记忆网络与 Transformer：类比，不是组件等价</text>
  <text x="50" y="111" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">将作者的相似感与注意力的技术定义并列；不据此指定新模型架构。</text>
  <polyline points="50,174 1150,174" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="76" y="207" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#0072B2" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">作者的记忆网络｜本文假说</text>
  <text x="658" y="207" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#D55E00" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Transformer 注意力｜技术定义</text>
  <rect x="50" y="249" width="514" height="570" rx="7" fill="#F2F8FC" stroke="#CBD5E1" stroke-width="1" />
  <rect x="636" y="249" width="514" height="570" rx="7" fill="#FFF6F0" stroke="#CBD5E1" stroke-width="1" />
  <polyline points="307,403 307,466.5" fill="none" stroke="#0072B2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="307,474 302.8,464 311.2,464" fill="#0072B2" stroke="none" />
  <polyline points="307,601 307,662.5" fill="none" stroke="#0072B2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="307,670 302.8,660 311.2,660" fill="#0072B2" stroke="none" />
  <rect x="83" y="283" width="448" height="120" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="83" y="283" width="5" height="120" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0" />
  <text x="106" y="303" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">5.4 词／词元（token）</text>
  <text x="106" y="342" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">词与关系怎样牵动相关记忆</text>
  <rect x="83" y="474" width="448" height="127" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="83" y="474" width="5" height="127" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0" />
  <text x="106" y="494" font-family="Microsoft YaHei" font-size="18.5" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">5.5 权重、共同参与与当前状态</text>
  <text x="106" y="533" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">多条联系按不同权重共同参与</text>
  <text x="106" y="558.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">当下生理状态调节参与程度</text>
  <rect x="83" y="670" width="448" height="100" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="83" y="670" width="5" height="100" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0" />
  <text x="106" y="690" font-family="Microsoft YaHei" font-size="19" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">当前理解与反应</text>
  <text x="106" y="729" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">相关内容共同参与</text>
  <polyline points="770,373 770,407 798,407 798,432.5" fill="none" stroke="#D55E00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="798,440 793.8,430 802.2,430" fill="#D55E00" stroke="none" />
  <polyline points="1012,373 1012,407 990,407 990,432.5" fill="none" stroke="#D55E00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="990,440 985.8,430 994.2,430" fill="#D55E00" stroke="none" />
  <polyline points="893,540 893,581 991,581 991,620.5" fill="none" stroke="#D55E00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="991,628 986.8,618 995.2,618" fill="#D55E00" stroke="none" />
  <polyline points="812,696 856.5,696" fill="none" stroke="#D55E00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="864,696 854,700.2 854,691.8" fill="#D55E00" stroke="none" />
  <rect x="668" y="283" width="204" height="90" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="668" y="283" width="5" height="90" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="691" y="303" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Q</text>
  <text x="691" y="342" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Query 向量</text>
  <rect x="906" y="283" width="212" height="90" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="906" y="283" width="5" height="90" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="929" y="303" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">K</text>
  <text x="929" y="342" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Key 向量</text>
  <rect x="668" y="440" width="450" height="100" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="668" y="440" width="5" height="100" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="691" y="460" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Q / K 的匹配 → 权重</text>
  <text x="691" y="499" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">通过 query 与 key 的匹配计算权重</text>
  <rect x="668" y="638" width="144" height="132" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="668" y="638" width="5" height="132" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="691" y="658" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">V</text>
  <text x="691" y="697" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Value</text>
  <text x="691" y="721.3" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">向量</text>
  <rect x="864" y="628" width="254" height="142" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="864" y="628" width="5" height="142" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0" />
  <text x="887" y="648" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">对 V 加权求和</text>
  <text x="887" y="687" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">由这些权重对 V 求和</text>
  <text x="887" y="711.3" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">得到注意力输出</text>
  <rect x="50" y="856" width="1100" height="144" rx="7" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />
  <text x="76" y="880" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#17212B" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">类比关注：联系、权重与不同内容的共同参与</text>
  <text x="76" y="925" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">本文尚未说明具体组件对应；不表示记忆等于 V、词元等于 Q / K，</text>
  <text x="76" y="950.65" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">也不表示生理状态等于注意力权重。</text>
  <polyline points="50,1034 1150,1034" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="50" y="1052" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#5B6775" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">左侧：本文假说与类比。右侧：Vaswani 等，§3.2 的注意力技术定义。图中没有实验数据或新增模型机制。</text>
</svg>
